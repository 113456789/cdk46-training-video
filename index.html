<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>携手抗癌，共筑希望 — CDK4/6抑制剂知识培训</title>
<style>
  :root {
    --accent: #c55a7a; --accent-dark: #a03d5e;
    --ink: #2f3a4d; --bg: #f5f9fc; --card: #ffffff;
    --ok: #2e9e6b; --bad: #d64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 26px; color: var(--accent-dark); }
  header p { color: #6b7a90; margin-top: 6px; font-size: 14px; }

  .player-box { position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(47,58,77,.18); }
  video { width: 100%; display: block; }
  .player-box:fullscreen { border-radius: 0; display: flex; align-items: center; justify-content: center; }
  .player-box:-webkit-full-screen { border-radius: 0; display: flex; align-items: center; justify-content: center; }
  .player-box:fullscreen video,
  .player-box:-webkit-full-screen video { width: auto; max-width: 100%; max-height: 100vh; }
  .player-box:fullscreen .quiz-card,
  .player-box:-webkit-full-screen .quiz-card { max-height: 92vh; overflow-y: auto; }
  .player-box.pseudo-fs { position: fixed; inset: 0; z-index: 999; border-radius: 0; }
  .player-box.pseudo-fs video { width: 100%; height: 100%; object-fit: contain; }
  body.pseudo-lock { overflow: hidden; }

  .fs-btn, .cc-btn {
    position: absolute; bottom: 58px; z-index: 6;
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(20,28,40,.55); color: #fff; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-weight: 600;
  }
  .fs-btn { right: 12px; font-size: 18px; }
  .cc-btn { right: 60px; }
  .cc-btn.on { background: var(--accent); }
  .fs-btn:hover, .cc-btn:hover { background: rgba(20,28,40,.8); }
  .cc-btn.on:hover { background: var(--accent-dark); }

  .sub-line {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 58px; z-index: 5; max-width: 86%;
    background: rgba(20,28,40,.62); color: #fff;
    font-size: 14px; line-height: 1.5; text-align: center;
    padding: 4px 12px; border-radius: 6px; pointer-events: none;
    display: none; white-space: normal;
  }
  .sub-line.show { display: block; }
  @media (max-width: 480px) {
    .sub-line { font-size: 12px; bottom: 52px; padding: 3px 9px; }
  }

  .load-mask {
    position: absolute; inset: 0; background: #101826; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #dfe7f2; gap: 14px;
  }
  .load-mask.hide { display: none; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.18); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-mask .lt { font-size: 15px; }
  .load-mask .ls { font-size: 13px; color: #93a3ba; }

  .quiz-mask {
    position: absolute; inset: 0; background: rgba(20,28,40,.72);
    display: none; z-index: 10;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .quiz-mask.show { display: flex; }
  .quiz-card {
    background: var(--card); width: min(620px, 100%); border-radius: 14px;
    padding: 26px 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin: auto;
  }
  @media (max-width: 480px) {
    .quiz-mask { padding: 10px; }
    .quiz-card { padding: 16px 14px; border-radius: 12px; }
    .quiz-card .tag { font-size: 12px; margin-bottom: 8px; }
    .quiz-card h3 { font-size: 15.5px; margin-bottom: 10px; }
    .opt { font-size: 13.5px; padding: 9px 12px; margin-bottom: 8px; }
    .quiz-msg { font-size: 12.5px; min-height: 18px; }
    .btn-continue { padding: 10px; font-size: 15px; }
  }
  @media (max-height: 500px) {
    .quiz-card { padding: 12px 16px; }
    .quiz-card .tag { margin-bottom: 6px; }
    .quiz-card h3 { font-size: 15px; margin-bottom: 8px; }
    .opt { padding: 7px 12px; margin-bottom: 6px; font-size: 13px; }
    .quiz-msg { font-size: 12px; min-height: 16px; }
    .btn-continue { padding: 8px; font-size: 14px; margin-top: 6px; }
  }
  .quiz-card .tag {
    display: inline-block; background: var(--accent); color: #fff;
    font-size: 13px; padding: 3px 12px; border-radius: 999px; margin-bottom: 12px;
  }
  .quiz-card h3 { font-size: 18px; line-height: 1.55; margin-bottom: 16px; }
  .opt {
    display: block; width: 100%; text-align: left; font-size: 15px; line-height: 1.5;
    padding: 12px 16px; margin-bottom: 10px; border-radius: 10px;
    border: 1.5px solid #d8e0ea; background: #fafcfe; cursor: pointer;
    transition: all .15s; font-family: inherit; color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .opt:hover { border-color: var(--accent); background: #fdf3f6; }
  .opt.correct { border-color: var(--ok); background: #eefaf4; color: var(--ok); font-weight: 600; }
  .opt.wrong { border-color: var(--bad); background: #fdf0f0; color: var(--bad); animation: shake .35s; }
  .opt:disabled { cursor: default; }
  .opt:not(.correct):not(.wrong):disabled { opacity: .55; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .quiz-msg { min-height: 22px; font-size: 14px; margin-top: 4px; line-height: 1.6; }
  .quiz-msg.bad { color: var(--bad); }
  .quiz-msg.good { color: var(--ok); }
  .btn-continue {
    display: none; margin-top: 10px; width: 100%; padding: 12px;
    background: var(--ok); color: #fff; border: none; border-radius: 10px;
    font-size: 16px; cursor: pointer; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .btn-continue:hover { background: #268a5d; }
  .passed-list { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
  .passed-list span {
    width: 26px; height: 26px; border-radius: 50%; background: #e3e9f0; color: #9aa7b8;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .passed-list span.hit { background: var(--ok); color: #fff; }
  .tip-bar {
    margin-top: 14px; background: var(--card); border-radius: 10px;
    padding: 12px 16px; box-shadow: 0 2px 10px rgba(47,58,77,.08);
    font-size: 14px; color: #4a5872; text-align: center;
  }
  footer { text-align: center; margin-top: 26px; color: #8a97a8; font-size: 12.5px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>携手抗癌，共筑希望 — CDK4/6抑制剂知识培训</h1>
    <p>个案管理师专项培训课程</p>
  </header>

  <div class="player-box" id="playerBox">
    <video id="v" playsinline webkit-playsinline preload="auto"></video>
    <div class="load-mask" id="loadMask">
      <div class="spinner"></div>
      <div class="lt">课程视频加载中…</div>
      <div class="ls" id="loadStatus">正在准备，视网络情况需数秒</div>
    </div>
    <button class="cc-btn on" id="ccBtn" title="字幕开关">字</button>
    <button class="fs-btn" id="fsBtn" title="全屏">⛶</button>
    <div class="sub-line" id="subLine"></div>
    <div class="quiz-mask" id="quizMask">
      <div class="quiz-card">
        <span class="tag">随堂提问 <span id="quizNo"></span>/6</span>
        <h3 id="quizQ"></h3>
        <div id="quizOpts"></div>
        <div class="quiz-msg" id="quizMsg"></div>
        <button class="btn-continue" id="btnGo">继续观看 ▶</button>
      </div>
    </div>
  </div>

  <div class="tip-bar">进度条可自由拖动 ｜ 播放或拖动到达考查点会自动暂停出题（跳过的题会依序补出），答对后继续 ｜ 可点击「字」开关字幕</div>
  <div class="passed-list" id="passedList"></div>

  <footer>本课程由 AI 辅助生成 ｜ 仅用于内部培训</footer>
</div>

<script src="sub_data.js"></script>
<script>
const video = document.getElementById('v');
const box = document.getElementById('playerBox');
const fsBtn = document.getElementById('fsBtn');
const ccBtn = document.getElementById('ccBtn');
const subLine = document.getElementById('subLine');
const mask = document.getElementById('quizMask');
const loadMask = document.getElementById('loadMask');
const loadStatus = document.getElementById('loadStatus');
const quizNo = document.getElementById('quizNo');
const quizQ = document.getElementById('quizQ');
const quizOpts = document.getElementById('quizOpts');
const quizMsg = document.getElementById('quizMsg');
const btnGo = document.getElementById('btnGo');
const passedList = document.getElementById('passedList');

/* ---------- 随堂题库（由脚本注入） ---------- */
const QUIZZES = [{"t": 218, "q": "CDK4/6抑制剂治疗乳腺癌的主要适用人群是以下哪一类？", "opts": ["HER2阳性、激素受体阴性乳腺癌患者", "HR阳性、HER2阴性乳腺癌患者", "三阴性乳腺癌患者", "所有类型的乳腺癌患者均可使用"], "a": 1, "exp": "CDK4/6抑制剂的获益人群明确限定为HR阳性、HER2阴性的乳腺癌患者。这一人群肿瘤生长依赖激素信号，CDK4/6抑制剂联合内分泌治疗可形成\"双重打击\"——内分泌治疗切断激素养料供应，CDK4/6抑制剂阻断癌细胞分裂程序。"}, {"t": 418, "q": "以下关于CDK4/6抑制剂用药方案的描述，哪一项是错误的？", "opts": ["哌柏西利、瑞波西利、达尔西利采用\"服药3周、停药1周\"的间歇给药方案", "阿贝西利推荐剂量为150mg每日两次，连续服用不停药", "达尔西利服药前后1小时内需空腹，其他药物建议随餐或餐后服用", "漏服后应在发现时立即补服双倍剂量，以确保血药浓度稳定"], "a": 3, "exp": "漏服后当天不补服，继续按原计划进行下一次用药，切勿一次服用双倍剂量。反复漏服会导致药物浓度不稳定、疗效下降，但补服双倍剂量会增加毒性风险。"}, {"t": 660, "q": "关于中性粒细胞减少的监测与管理，以下说法正确的是：", "opts": ["中性粒细胞减少多为不可恢复的严重不良反应，需立即永久停药", "治疗开始前无需检查血常规，可直接开始服药", "出现3~4级中性粒细胞减少伴发热时，应考虑暂停用药并启动G-CSF升白治疗", "患者体温38℃时无需就医，可自行服用退烧药观察"], "a": 2, "exp": "中性粒细胞减少是CDK4/6抑制剂最常见但大多为可预期、可监测、可恢复的不良反应。3~4级减少伴发热需暂停用药并给予升白针G-CSF。治疗前必须查血常规建立基线；体温≥38.3℃或伴寒战、咽痛等感染症状应立即就医，不可自行处理。"}, {"t": 816, "q": "服用阿贝西利出现腹泻时，以下居家管理措施中哪一项是不正确的？", "opts": ["出现稀便即刻服用洛哌丁胺止泻，腹泻停止12小时后可停药", "多饮温水或电解质饮料，少量多次，预防脱水", "选择清淡易消化的BRAT饮食，避免辛辣油腻食物", "腹泻严重时应立即自行停药，等症状完全缓解后再恢复用药"], "a": 3, "exp": "腹泻时不应自行停药，而应及时联系主治医生调整治疗方案。自行停药可能导致疗效中断。正确做法是及时止泻、充分补水、调整饮食，并在每日腹泻＞6次、伴血便/黑便、严重腹痛或脱水表现时立即就医。"}, {"t": 1040, "q": "以下关于CDK4/6抑制剂不良反应的描述，哪一项是正确的？", "opts": ["皮疹发生率很高且多为重度，需立即停药处理", "出现药物性肝损伤时，患者可自行服用保肝保健品辅助恢复", "治疗期间出现皮肤或眼白发黄、尿液呈浓茶色，应立即就医检查肝功能", "脱发与毛发稀疏为不可逆损伤，停药后无法恢复"], "a": 2, "exp": "皮肤/眼白发黄、尿液浓茶色是肝损伤导致胆红素代谢障碍的典型表现，需立即就医。皮疹发生率≤20%且多为轻度；肝损伤期间禁止自行服用保健品或偏方；脱发通常为可逆性，停药后可逐渐恢复。"}, {"t": 1169, "q": "关于瑞波西利相关QT间期延长的监测与处理，以下说法错误的是：", "opts": ["治疗前需完成基线ECG检查，第1周期第14天及第2周期开始时需复查", "QTcF＞480ms时应中断治疗，恢复后降低剂量重启", "QTcF＞500ms或伴严重心律失常时，应永久停用瑞波西利", "QT间期延长多为不可逆损伤，即使停药也无法恢复至基线水平"], "a": 3, "exp": "QT间期延长通常表现为可逆性改变，暂停用药或调整剂量后多可恢复至基线水平。其余选项均为正确描述：基线+周期内ECG监测是标准流程；QTcF>480ms减量重启；>500ms或伴严重心律失常需永久停药。"}];

/* 答题进度圆点 */
QUIZZES.forEach((_, i) => {
  const s = document.createElement('span');
  s.textContent = i + 1;
  passedList.appendChild(s);
});

/* ---------- 自适应播放器：探测 Range 支持，HTTP 206 则原生流式（首屏即播、可拖动）；否则整片预载为 Blob ---------- */
(async function preload() {
  loadStatus.textContent = '正在连接…';
  let supportsRange = false;
  try {
    const probe = await fetch('video.mp4', { method: 'GET', headers: { 'Range': 'bytes=0-1023' } });
    supportsRange = probe.status === 206;
    if (probe.body && probe.body.getReader) { try { await probe.body.getReader().cancel(); } catch (e) {} }
  } catch (e) {}

  if (supportsRange) {
    video.src = 'video.mp4';
    video.controls = true;
    video.addEventListener('canplay', () => loadMask.classList.add('hide'), { once: true });
    return;
  }

  // 网关不支持 Range：整片预载为 Blob，本地拖动/续播才稳定
  try {
    const res = await fetch('video.mp4');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let blob;
    if (res.body && res.body.getReader) {
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        loadStatus.textContent = '已加载 ' + (received / 1048576).toFixed(1) + ' MB';
      }
      blob = new Blob(chunks, { type: 'video/mp4' });
    } else {
      blob = await res.blob();
    }
    video.src = URL.createObjectURL(blob);
    video.controls = true;
    loadMask.classList.add('hide');
  } catch (e) {
    loadStatus.textContent = '加载失败，请刷新页面重试（' + e.message + '）';
    document.querySelector('.spinner').style.display = 'none';
  }
})();

/* ---------- 字幕开关 ---------- */
let subsOn = localStorage.getItem('rx_subs_on') !== '0';
function refreshCC() {
  ccBtn.classList.toggle('on', subsOn);
  if (!subsOn) subLine.classList.remove('show');
}
ccBtn.onclick = () => {
  subsOn = !subsOn;
  localStorage.setItem('rx_subs_on', subsOn ? '1' : '0');
  refreshCC();
};
function updateSub() {
  if (!subsOn || gating) { subLine.classList.remove('show'); return; }
  const t = video.currentTime;
  const cue = SUBS.find(c => t >= c[0] && t <= c[1]);
  if (cue) { subLine.textContent = cue[2]; subLine.classList.add('show'); }
  else { subLine.classList.remove('show'); }
}
video.addEventListener('timeupdate', updateSub);
video.addEventListener('seeked', updateSub);
refreshCC();

/* ---------- 弹窗逻辑：到达或拖动越过未作答题 => 依序弹出 ---------- */
let gating = false;
let quizIdx = -1;
const passed = new Set();

video.addEventListener('timeupdate', () => {
  if (gating) return;
  const t = video.currentTime;
  const due = QUIZZES.findIndex((qz, i) => !passed.has(i) && t >= qz.t);
  if (due >= 0) openQuiz(due);
});

function openQuiz(i) {
  gating = true;
  quizIdx = i;
  // 容器全屏内直接弹题；仅 iPhone 原生视频全屏（网页元素无法覆盖）时先退出
  if (!fsElement() && video.webkitDisplayingFullscreen) {
    try { video.webkitExitFullscreen(); } catch (e) {}
  }
  video.pause();                     // 原地暂停，不回跳
  setTimeout(() => {
    const qz = QUIZZES[i];
    quizNo.textContent = i + 1;
    quizQ.textContent = qz.q;
    quizMsg.textContent = '';
    quizMsg.className = 'quiz-msg';
    btnGo.style.display = 'none';
    quizOpts.innerHTML = '';
    qz.opts.forEach((txt, k) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = 'ABCD'[k] + '．' + txt;
      b.onclick = () => choose(b, k, qz);
      quizOpts.appendChild(b);
    });
    mask.classList.add('show');
  }, 350);
}

function choose(btn, k, qz) {
  const opts = quizOpts.querySelectorAll('.opt');
  if (btn.disabled) return;
  if (k === qz.a) {
    opts.forEach(o => o.disabled = true);
    btn.classList.add('correct');
    quizMsg.textContent = '✓ 回答正确！' + qz.exp;
    quizMsg.className = 'quiz-msg good';
    btnGo.style.display = 'block';
    passed.add(quizIdx);
    passedList.children[quizIdx].classList.add('hit');
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    quizMsg.textContent = '✗ 不对哦，再想一想～ 提示：结合刚才讲到的内容作答';
    quizMsg.className = 'quiz-msg bad';
  }
}

btnGo.onclick = () => {
  mask.classList.remove('show');
  gating = false;
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
};

/* ---------- 全屏：作用于播放器容器（弹窗/字幕随容器全屏） ---------- */
function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function exitAnyFullscreen() {
  try {
    if (fsElement()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
    if (video.webkitExitFullscreen) video.webkitExitFullscreen();
    box.classList.remove('pseudo-fs');
    document.body.classList.remove('pseudo-lock');
  } catch (e) {}
}
fsBtn.onclick = () => {
  if (fsElement() || box.classList.contains('pseudo-fs')) {
    exitAnyFullscreen();
    return;
  }
  if (box.requestFullscreen) {
    box.requestFullscreen().catch(() => pseudoFS());
  } else if (box.webkitRequestFullscreen) {
    box.webkitRequestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();      // iPhone 原生全屏；弹题时会自动退出
  } else {
    pseudoFS();
  }
};
function pseudoFS() {
  box.classList.add('pseudo-fs');
  document.body.classList.add('pseudo-lock');
}
</script>
</body>
</html>
